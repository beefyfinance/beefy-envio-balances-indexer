  chainId: Int! @index
  "The CLM aggregate"
  clm: Clm!
  "The account"
  account: Account!
  "The position"
  clmPosition: ClmPosition!

  "Transaction hash"
  trxHash: Bytes! @index
  "Transaction index"
  trxIndex: Int! @index
  "Log index"
  logIndex: Int! @index
  "Block number"
  blockNumber: BigInt! @index
  "Block timestamp"
  blockTimestamp: Timestamp! @index

  "Interaction type"
  type: ClmPositionInteractionType!

  "Position balances after interaction"
  managerBalance: BigDecimal! @config(precision: 100, scale: 24)
  rewardPoolBalances: [BigDecimal!]!
  totalBalance: BigDecimal! @config(precision: 100, scale: 24)
  "Underlying balances after interaction"
  underlyingBalance0: BigDecimal! @config(precision: 100, scale: 24)
  underlyingBalance1: BigDecimal! @config(precision: 100, scale: 24)

  "Balance deltas"
  managerBalanceDelta: BigDecimal! @config(precision: 100, scale: 24)
  rewardPoolBalancesDelta: [BigDecimal!]!
  rewardBalancesDelta: [BigDecimal!]!
  "Reward pool from which rewards were claimed"
  claimedRewardPool: RewardPool
  underlyingBalance0Delta: BigDecimal! @config(precision: 100, scale: 24)
  underlyingBalance1Delta: BigDecimal! @config(precision: 100, scale: 24)

  "Prices at time of interaction"
  token0ToNativePrice: BigDecimal! @config(precision: 100, scale: 24)
  token1ToNativePrice: BigDecimal! @config(precision: 100, scale: 24)
  outputToNativePrices: [BigDecimal!]!
  rewardToNativePrices: [BigDecimal!]!
  nativeToUSDPrice: BigDecimal! @config(precision: 100, scale: 24)
}

