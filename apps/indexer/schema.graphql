# Strategy activity
# ---------------------------------------------------------------------------------------------------------------------

enum HarvestKind {
  "classic StratHarvest (both ABIs): harvester, wantHarvested, tvl"
  CLASSIC_STRAT_HARVEST
  "CLM Harvest: fee0, fee1"
  CLM_HARVEST
  "CLM HarvestRewards: fees"
  CLM_HARVEST_REWARDS
  "CLM ClaimedFees: feeMain0, feeMain1, feeAlt0, feeAlt1"
  CLM_CLAIMED_FEES
  "CLM ClaimedRewards: fees"
  CLM_CLAIMED_REWARDS
}

type Harvest
  @index(fields: ["blockTimestamp"])
  @storage(clickhouse: { orderBy: ["chainId", "blockTimestamp", "strategy", "logIndex"] })
{
  id: ID!
  strategy: String!
  kind: HarvestKind!
  harvester: String
  wantHarvested: BigInt
  tvl: BigInt
  fee0: BigInt
  fee1: BigInt
  fees: BigInt
  feeMain0: BigInt
  feeMain1: BigInt
  feeAlt0: BigInt
  feeAlt1: BigInt
  blockNumber: BigInt! @config(precision: 20)
  blockTimestamp: Timestamp!
  trxHash: String!
  trxFrom: String
  logIndex: Int!
}

enum ProductFamily {
  CLASSIC
  CLM
}

type FeesCharged @storage(clickhouse: { orderBy: ["chainId", "strategy", "blockNumber", "logIndex"] }) {
  id: ID!
  strategy: String!
  family: ProductFamily!
  "1: ChargedFees(beefyFee, liquidityFee), 2: ChargedFees(callFee, beefyFee, strategistFee)"
  version: Int!
  callFee: BigInt
  beefyFee: BigInt!
  strategistFee: BigInt
  liquidityFee: BigInt
  blockNumber: BigInt! @config(precision: 20)
  blockTimestamp: Timestamp!
  trxHash: String!
  trxFrom: String
  logIndex: Int!
}

type PauseChange @storage(clickhouse: { orderBy: ["chainId", "contract", "blockNumber", "logIndex"] }) {
  id: ID!
  contract: String!
  paused: Boolean!
  account: String!
  blockNumber: BigInt! @config(precision: 20)
  blockTimestamp: Timestamp!
  trxHash: String!
  trxFrom: String
  logIndex: Int!
}

