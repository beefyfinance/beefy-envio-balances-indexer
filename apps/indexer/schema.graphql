# Raw-events schema (docs/architecture.md).
#
# - Amounts are raw on-chain integers (no decimals applied).
# - Addresses and hashes are lowercase 0x hex strings.
# - `chainId` is added to every table by Envio (disable_default_cross_chain); ids still start with the chain id so
#   they are unique across chains in ClickHouse.
# - Event rows carry blockNumber, blockTimestamp, trxHash, trxFrom (EOA sender, labels zaps), logIndex and the
#   emitting contract. Event ids: `chainId-trxHash-logIndex`.
# - Storage: entities without a storage directive go to ClickHouse only (config.yaml). Entities that handlers read, and
#   current-state tables, are stored in Postgres too.
# - Block numbers use `@config(precision: 20)` so ClickHouse keeps them numeric (sortable).

# ---------------------------------------------------------------------------------------------------------------------
# Registry and on-chain facts
# ---------------------------------------------------------------------------------------------------------------------

enum ContractKind {
  VAULT
  STRATEGY
  BOOST
  REWARD_POOL
  CLM_MANAGER
  CLM_STRATEGY
  ERC4626_ADAPTER
  LST_VAULT
  SWAPPER
  # explicit non-vault share tokens from config.yaml (mooBIFI, beTokens, BIFI)
  TOKEN
  # ClassicVaultFactory proxy that is neither a vault, a strategy nor a boost; ContractFactory deployments
  UNKNOWN
}

enum FactsStatus {
  # every one-time read succeeded
  OK
  # at least one read reverted or returned 0x0: retried by a later event, at most once per 10 000 blocks
  PARTIAL
}

type Contract @storage(postgres: true, clickhouse: true) {
  "chainId-address"
  id: ID!
  address: String!
  kind: ContractKind!
  "factory that emitted the creation event; unset for addresses listed in config.yaml"
  factory: String
  createdBlock: BigInt @config(precision: 20)
  createdTimestamp: Timestamp
  createdTrxHash: String
  "name from *WithName / ContractDeployed factory events"
  deployName: String
  "block of the event at which the one-time facts (read at latest: links, token metadata) were last read"
  factsBlock: BigInt @config(precision: 20)
  factsStatus: FactsStatus
  """
  Price facts (docs/architecture.md "Price facts on Contract", the rule of productFactsCtes): the product whose
  share price prices this contract's rows (the contract itself for a vault or CLM manager, the staked product for a
  boost or reward pool), and the decimals that price is per (want decimals for a classic vault, share decimals
  otherwise), and the product's kind. `productAddress` is set as soon as known; `priceDecimals` and `productKind`
  together once the product is registered (and, for a vault, its want's decimals read). Never set for other kinds.
  """
  productAddress: String
  priceDecimals: Int
  productKind: ContractKind
}

enum TokenMetadataStatus {
  OK
  # decimals() / name() / symbol() reverted
  INVALID
}

type Token @storage(postgres: true, clickhouse: true) {
  "chainId-address"
  id: ID!
  address: String!
  decimals: Int
  symbol: String
  name: String
  metadataStatus: TokenMetadataStatus!
  "share token of a Beefy product (vault, CLM manager, reward pool, adapter, LST vault, boost, configured token)"
  isBeefyShare: Boolean!
}

enum LinkRelation {
  VAULT_WANT
  VAULT_STRATEGY
  STRATEGY_VAULT
  BOOST_STAKED
  BOOST_REWARD
  REWARD_POOL_STAKED
  REWARD_POOL_REWARD
  CLM_WANT0
  CLM_WANT1
  CLM_POOL
  CLM_STRATEGY_MANAGER
  ADAPTER_VAULT
}

enum LinkSource {
  READ
  EVENT
}

type ContractLink @index(fields: ["fromAddress", "relation"]) {
  "READ: chainId-from-relation-read; EVENT: chainId-trxHash-logIndex-relation"
  id: ID!
  fromAddress: String!
  toAddress: String!
  relation: LinkRelation!
  source: LinkSource!
  sinceBlock: BigInt! @config(precision: 20)
  sinceTimestamp: Timestamp!
  trxHash: String
  logIndex: Int
}

