# ---------------------------------------------------------------------------------------------------------------------
# User timeline (docs/architecture.md)
# ---------------------------------------------------------------------------------------------------------------------

enum TimelineKind {
  BALANCE
  CLM_DEPOSIT
  CLM_WITHDRAW
  CLAIM
  MINT
  BURN
}

"""
Everything an account did, sorted by account so ClickHouse reads it in place. Only BALANCE rows move a share balance;
MINT and BURN mark a balance change as a deposit or a withdrawal (shares created from or destroyed to 0x0, directly or
through a router in the same transaction), the CLM rows carry the underlying amounts, CLAIM the reward paid.
Fields that do not apply to a kind are '' or 0.
"""
type TimelineEvent
  # Postgres only: the balance checks of scripts/correctness.ts read BALANCE rows per token
  @index(fields: ["contract", "account", "blockNumber", "logIndex"])
  @storage(clickhouse: { orderBy: ["account", "chainId", "blockNumber", "logIndex"] })
{
  "chainId-trxHash-logIndex-account-kind"
  id: ID!
  account: String!
  kind: TimelineKind!
  "share token (or boost) for BALANCE, MINT and BURN, the CLM manager for CLM_*, the reward pool or boost for CLAIM"
  contract: String!
  "BALANCE only: TRANSFER or BOOST_STAKE"
  source: String!
  "BALANCE only: signed share change and the account's balance of `contract` after it"
  delta: BigInt!
  sharesAfter: BigInt!
  "CLM_* only: underlying token amounts"
  amount0: BigInt!
  amount1: BigInt!
  "CLAIM only; '' for boosts (see the BOOST_REWARD link)"
  rewardToken: String!
  rewardAmount: BigInt!
  blockNumber: BigInt! @config(precision: 20)
  blockTimestamp: Timestamp!
  logIndex: Int!
  trxHash: String!
  """
  Indexer price (docs/architecture.md "Indexer prices"): the Beefy API share price of `headProduct` cached when
  the handler ran, per 10^headDecimals share units, fetched at `headPriceAt`. Set only on events indexed within 10
  minutes of their block with a price at most 15 minutes old (and known price facts); not deterministic (a reindex
  writes another value or none).
  """
  headPrice: Float
  headPriceAt: Timestamp
  """
  Price facts of `contract` when the handler ran (as productFactsCtes: the product, the decimals its price is per,
  the product's kind and the contract's kind: VAULT, CLM_MANAGER, BOOST or REWARD_POOL), whether or not the event got
  a price; unset while the contract's price facts are not known.
  """
  headProduct: String
  headDecimals: Int
  headProductKind: String
  headContractKind: String
}

"""
Zap attribution state, per share token: the mints and the transfers between two non-zero accounts of the latest
transaction that moved the token, in log order (one entry per index of the lists). Replaced by the next transaction.
"""
type ShareFlow @storage(postgres: true, clickhouse: false) {
  "chainId-token"
  id: ID!
  trxHash: String!
  "0x0 for a mint"
  fromAddresses: [String!]!
  toAddresses: [String!]!
  values: [BigInt!]!
  logIndexes: [Int!]!
}

