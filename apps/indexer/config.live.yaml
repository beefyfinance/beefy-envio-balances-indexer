# yaml-language-server: $schema=./node_modules/envio/evm.schema.json
name: beefy-balance-indexer
description: Beefy Finance raw-events indexer - share transfers, balances, stakes, rewards, harvests, swapper routes
handlers: src/handlers
address_format: lowercase
raw_events: false
save_full_history: false
# Per-chain entity/effect isolation (recommended; default in HyperIndex v4)
disable_default_cross_chain: true
storage:
  # Append-only event tables live in ClickHouse only (schema default); entities that handlers read (and
  # current-state tables) opt into Postgres with a storage directive in schema.graphql.
  postgres:
    default: false
    column_name_format: snake_case
  clickhouse:
    default: true
    column_name_format: snake_case

# Event source per chain: HyperSync, with the rpc entry as fallback and for contract reads. `ENVIO_RPC_FOR=sync` makes
# the rpc entry the event source instead (RPC only, no HyperSync); hyperevm and metis always sync over RPC.
# `from` labels zaps (EOA that sent the transaction). Block number / timestamp are selected by default.
field_selection:
  transaction_fields: [hash, from]

contracts:
  # factories
  - name: ClassicVaultFactory
    abi_file_path: abis/beefy/classic/ClassicVaultFactory.json
    events:
      - event: "ProxyCreated(address proxy)"
        name: VaultOrStrategyCreated
        field_selection:
          # `input` classifies the proxy (cloneVault / cloneContract / booooost) without an eth_call
          transaction_fields: [hash, from, input]

  - name: ClassicStrategyFactory
    abi_file_path: abis/beefy/classic/ClassicStrategyFactory.json
    events:
      - event: "ProxyCreated(address proxy)"
        name: StrategyCreated
      - event: "ProxyCreated(string strategyName, address proxy)"
        name: StrategyCreatedWithName

  - name: ClassicBoostFactory
    abi_file_path: abis/beefy/classic/ClassicBoostFactory.json
    events:
      - event: "ProxyCreated(address proxy)"
        name: BoostCreated
      - event: "BoostDeployed(address boost)"

  - name: RewardPoolFactory
    abi_file_path: abis/beefy/common/RewardPoolFactory.json
    events:
      - event: "ProxyCreated(address proxy)"
        name: RewardPoolCreated
      - event: "ProxyCreated(string rewardPoolName, address proxy)"
        name: RewardPoolCreatedWithName

  - name: ClmManagerFactory
    abi_file_path: abis/beefy/clm/ClmManagerFactory.json
    events:
      - event: "ProxyCreated(address proxy)"
        name: ClmManagerCreated

  - name: ClmStrategyFactory
    abi_file_path: abis/beefy/clm/ClmStrategyFactory.json
    events:
      - event: "ProxyCreated(address proxy)"
        name: ClmStrategyCreated
      - event: "ProxyCreated(string strategyName, address proxy)"
        name: ClmStrategyCreatedWithName

  - name: ContractFactory
    abi_file_path: abis/beefy/ContractFactory.json
    events:
      - event: "ContractDeployed(bytes32 contractName,address proxy)"

  - name: Erc4626AdapterFactory
    abi_file_path: abis/beefy/common/Erc4626AdapterFactory.json
    events:
      - event: "ProxyCreated(address proxy)"
        name: Erc4626AdapterCreated

  # contracts
  - name: ClassicVault
    abi_file_path: abis/beefy/classic/ClassicVault.json
    events:
      - event: "Initialized(uint8 version)"
      - event: "UpgradeStrat(address implementation)"
      - event: "Transfer(address indexed from, address indexed to, uint256 value)"

  - name: ClassicStrategy
    abi_file_path: abis/beefy/classic/ClassicStrategy.json
    events:
      - event: "Initialized(uint8 version)"
      - event: "ChargedFees(uint256 beefyFee, uint256 liquidityFee)"
      - event: "ChargedFees(uint256 callFees, uint256 beefyFees, uint256 strategistFees)"
        name: ChargedFeesV2
      - event: "Paused(address account)"
      - event: "Unpaused(address account)"

  - name: ClassicStrategyStratHarvest0
    abi_file_path: abis/beefy/classic/ClassicStrategyStratHarvest0.json
    events:
      - event: "StratHarvest(address indexed harvester, uint256 wantHarvested, uint256 tvl)"

  - name: ClassicStrategyStratHarvest1
    abi_file_path: abis/beefy/classic/ClassicStrategyStratHarvest1.json
    events:
      - event: "StratHarvest(address indexed harvester, uint256 indexed wantHarvested, uint256 indexed tvl)"

  - name: ClassicBoost
    abi_file_path: abis/beefy/classic/ClassicBoost.json
    events:
      - event: "Initialized(uint8 version)"
      - event: "Staked(address indexed user, uint256 amount)"
      - event: "Withdrawn(address indexed user, uint256 amount)"
      - event: "RewardAdded(uint256 reward)"
      - event: "RewardPaid(address indexed user, uint256 reward)"

  - name: RewardPool
    abi_file_path: abis/beefy/common/RewardPool.json
    events:
      - event: "Initialized(uint8 version)"
      - event: "Transfer(address indexed from, address indexed to, uint256 value)"
      - event: "NotifyReward(address indexed reward, uint256 amount, uint256 duration)"
      - event: "RewardPaid(address indexed user, address indexed reward, uint256 amount)"
      - event: "AddReward(address indexed reward)"

  - name: ClmManager
    abi_file_path: abis/beefy/clm/ClmManager.json
    events:
      - event: "Initialized(uint8 version)"
      - event: "Transfer(address indexed from, address indexed to, uint256 value)"
      - event: "Deposit(address indexed user, uint256 shares, uint256 amount0, uint256 amount1, uint256 fee0, uint256 fee1)"
      - event: "Withdraw(address indexed user, uint256 shares, uint256 amount0, uint256 amount1)"

  - name: ClmStrategy
    abi_file_path: abis/beefy/clm/ClmStrategy.json
    events:
      - event: "Initialized(uint8 version)"
      - event: "Harvest(uint256 fee0, uint256 fee1)"
      - event: "HarvestRewards(uint256 fees)"
      - event: "ClaimedFees(uint256 feeMain0, uint256 feeMain1, uint256 feeAlt0, uint256 feeAlt1)"
      - event: "ClaimedRewards(uint256 fees)"
      - event: "ChargedFees(uint256 beefyFee, uint256 liquidityFee)"
      - event: "ChargedFees(uint256 callFeeAmount, uint256 beefyFeeAmount, uint256 strategistFeeAmount)"
        name: ChargedFeesV2
      - event: "TVL(uint256 bal0, uint256 bal1)"
      - event: "Paused(address account)"
      - event: "Unpaused(address account)"

  - name: LstVault
    abi_file_path: abis/beefy/lst/LstVault.json
    events:
      - event: "Initialized(uint8 version)"
      - event: "Transfer(address indexed from, address indexed to, uint256 value)"

  - name: Erc4626Adapter
    abi_file_path: abis/beefy/common/Erc4626Adapter.json
    events:
      - event: "Initialized(uint8 version)"
      - event: "Transfer(address indexed from, address indexed to, uint256 value)"

  # Explicit list of non-vault share tokens (mooBIFI, beTokens, BIFI). Never add want tokens here (volume).
  - name: Token
    abi_file_path: abis/IERC20/IERC20.json
    events:
      - event: "Initialized(uint8 version)"
      - event: "Transfer(address indexed from, address indexed to, uint256 value)"

  - name: BeefySwapper
    abi_file_path: abis/beefy/common/BeefySwapper.json
    events:
      - event: "SetSwapInfo(address indexed fromToken, address indexed toToken, (address router, bytes data, uint256 amountIndex, uint256 minIndex, int8 minAmountSign) swapInfo)"
      - event: "SetOracle(address oracle)"
      - event: "SetSlippage(uint256 slippage)"
      - event: "Initialized(uint8 version)"

