enum ContractKind {
  VAULT
  STRATEGY
  BOOST
  REWARD_POOL
  CLM_MANAGER
  CLM_STRATEGY
  ERC4626_ADAPTER
  LST_VAULT
  SWAPPER
  # explicit non-vault share tokens from config.yaml (mooBIFI, beTokens, BIFI)
