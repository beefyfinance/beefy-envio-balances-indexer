packages:
  - "apps/*"
  - "packages/*"

# Versions shared by several workspace packages live here, exact, and are referenced as `catalog:`. Anything
# in the catalog that a package pins to another version fails the install (catalogMode: strict).
catalog:
  "@types/node": 25.6.2
  remeda: 2.34.0
  tsx: 4.21.0
  typescript: 7.0.2
  viem: 2.56.3
  vitest: 4.1.5
  zod: 4.6.7
catalogMode: strict

# Supply chain
minimumReleaseAge: 10080 # 1 week
trustPolicy: no-downgrade
trustPolicyExclude: []
blockExoticSubdeps: true
strictDepBuilds: true
allowBuilds:
  lefthook: true
  esbuild: false

# Reproducibility
engineStrict: true
savePrefix: ""
verifyDepsBeforeRun: warn
updateNotifier: false
