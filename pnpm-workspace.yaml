packages:
  - "apps/*"
  - "packages/*"
  - "tools/*"

# Versions shared by several workspace packages live here, exact, and are referenced as `catalog:`. Anything
# in the catalog that a package pins to another version fails the install (catalogMode: strict).
catalog:
  '@clickhouse/client': 1.24.1
  "@types/node": 26.6.5
  apache-arrow: 21.2.0
  commander: 15.0.0
  oxlint: 1.89.0
  pino: 10.4.0
  remeda: 2.53.0
  tsx: 4.23.15
  typescript: 7.0.2
  viem: 2.57.10
  vitest: 5.0.5
  zod: 4.6.7
catalogMode: strict

# Security fixes for exact pins of our dependencies, to drop once they ship them. envio pins express 4.19.2 (its local
# metrics server: body-parser, path-to-regexp, qs, send, serve-static, cookie advisories); viem pins ws 8.20.1 or
# 8.21.0 (one version for all, so its peers agree).
overrides:
  express@4.19.2: 4.22.3
  ws@<8.21.3: 8.21.3

# Supply chain
minimumReleaseAge: 10080 # 1 week
trustPolicy: no-downgrade
trustPolicyExclude: []
blockExoticSubdeps: true
strictDepBuilds: true
allowBuilds:
  lefthook: true
  esbuild: false

# Reproducibility
engineStrict: true
savePrefix: ""
verifyDepsBeforeRun: warn
updateNotifier: false
