# The same gate as the pre-push hook (`pnpm test`), plus the ClickHouse integration tests against a throwaway server.
# Actions are pinned by commit SHA (the tag is in the comment); bump both together.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `envio codegen` interpolates every ENVIO_RPC_URL_<chainId> in config.yaml and stops when one is unset. Loopback
      # placeholders, set for this step only, so the unit tests below still run without them; `pnpm test` then takes
      # codegen from Turborepo's local cache.
      - name: codegen
        run: |
          for chain_var in $(grep -oh 'ENVIO_RPC_URL_[0-9]*' apps/indexer/config*.yaml | sort -u); do
            export "$chain_var=http://127.0.0.1:8545"
          done
          pnpm codegen
      # typecheck, unit tests, lint and secretlint; offline, from the recorded RPC fixtures
      - run: pnpm test
        env:
          RPC_FIXTURES: replay

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      clickhouse:
        # same image as docker-compose.yml
        image: clickhouse/clickhouse-server:25.10.2.65
        ports:
          - 18123:8123
        env:
          CLICKHOUSE_USER: default
          CLICKHOUSE_PASSWORD: ""
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
        options: >-
          --health-cmd "wget --quiet --spider --tries=1 http://localhost:8123/ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      CLICKHOUSE_URL: http://localhost:18123
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @beefy/clickhouse test:integration
      - run: pnpm --filter @beefy/api test:integration
